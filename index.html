<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integrated Spatial Biodiversity Tool</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f5f7fa; color: #1c2b39;
    overflow: hidden;
  }

  /* ── Loading screen ─────────────────────────────────────────────── */
  #loader {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; background: #f5f7fa;
    transition: opacity .6s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #logo  { width: min(240px, 60vw); height: auto; margin-bottom: 26px; }
  h1     { margin: 0 0 6px; font-size: clamp(22px, 4.2vw, 32px); font-weight: 700; color: #1c2b39; letter-spacing: .3px; }
  .sub   { margin: 0 0 30px; font-size: 14px; color: #5c6b7a; }

  /* progress bar (the only loading indicator: the spinning wheel was removed) */
  .bar   { width: min(420px, 80vw); height: 8px; background: #dde3ea; border-radius: 6px; overflow: hidden; }
  #fill  { width: 0%; height: 100%; background: #1976d2; border-radius: 6px; transition: width .4s linear; }
  #msg   { margin-top: 14px; min-height: 20px; font-size: 13px; color: #5c6b7a; }
  #retry { display: none; margin-top: 14px; font-size: 13px; }
  #retry a { color: #1976d2; }
  .foot  { position: absolute; bottom: 16px; left: 0; right: 0; font-size: 11px; color: #9aa7b4; }

  /* ── App frame ───────────────────────────────────────────────────── */
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; }
  #app.show { visibility: visible; }

  @media (prefers-reduced-motion: reduce) {
    #loader, #fill { transition: none; }
  }
</style>
</head>
<body>

<div id="loader">
  <img id="logo" src="logo.svg" alt="Nature and Culture International">
  <h1>Integrated Spatial Biodiversity Tool</h1>
  <p class="sub">Nature and Culture International</p>

  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
    <div id="fill"></div>
  </div>
  <div id="msg" aria-live="polite">Connecting to server...</div>
  <div id="retry">This is taking longer than usual. <a href="" onclick="location.reload(); return false;">Try again</a></div>

  <div class="foot">Nature and Culture International &middot; Biodiversity Assessment &middot; 2026</div>
</div>

<!-- No src here on purpose: the script below sets it ONCE (avoids loading the app twice). -->
<iframe id="app" title="Integrated Spatial Biodiversity Tool" allow="fullscreen"></iframe>

<script>
  // ───────────── SETTINGS ─────────────
  // The Cloudflare quick-tunnel address changes every time the NAS reboots. The NAS script
  // (publish_tunnel_url.sh) sends the current address to a small Cloudflare Worker ("nci-url");
  // this page asks the Worker for it. PASTE THE WORKER ADDRESS HERE: copy it from the
  // fetch("https://....workers.dev") line of the index.html that is online now.
  var WORKER_URL = "https://nci-url.wildersonmedinabaron.workers.dev";
  // Only used if the Worker cannot be reached (then edit it by hand after a NAS reboot):
  var tunnelUrl  = "https://brass-alarm-barely-nathan.trycloudflare.com";
  var appPath        = "/nci-app/";   // folder the Shiny app is served from inside the container
  var COLD_TIMER     = 70000;         // cold start: full animated sequence (ms)
  var WARM_TIMER     = 4000;          // warm app: short screen (ms)
  var WARM_THRESHOLD = 8000;          // iframe answered in less than this = warm app
  var FALLBACK_TIMER = 300000;        // 5 min: show the app / retry link no matter what

  // Messages shown under the bar (percent where each one starts).
  var STEPS = [
    [0,  "Connecting to server..."],
    [15, "Starting the analysis engine..."],
    [35, "Loading protected-area boundaries..."],
    [60, "Loading species ranges and occurrence records..."],
    [85, "Almost ready..."]
  ];

  // ───────────── LOGIC ─────────────
  var loader = document.getElementById("loader");
  var fill   = document.getElementById("fill");
  var bar    = document.getElementById("bar");
  var msg    = document.getElementById("msg");
  var retry  = document.getElementById("retry");
  var frame  = document.getElementById("app");

  var t0 = Date.now(), mode = "cold", frameLoaded = false, appReady = false, finished = false;
  var endStart = null;   // {time, pct, ms}: set when the app says it is ready

  function setPct(p) {
    p = Math.max(0, Math.min(100, p));
    fill.style.width = p + "%";
    bar.setAttribute("aria-valuenow", Math.round(p));
    for (var i = STEPS.length - 1; i >= 0; i--) {
      if (p >= STEPS[i][0]) { msg.textContent = STEPS[i][1]; break; }
    }
  }

  function reveal() {
    if (finished) return;
    finished = true;
    setPct(100);
    frame.classList.add("show");
    loader.classList.add("hide");
    setTimeout(function () { loader.style.display = "none"; }, 700);
  }

  function tick() {
    if (finished) return;
    var now = Date.now(), elapsed = now - t0, pct;

    if (endStart) {                                   // app is ready: run the bar to 100%
      pct = endStart.pct + (100 - endStart.pct) * Math.min(1, (now - endStart.time) / endStart.ms);
      setPct(pct);
      if (pct >= 100) { reveal(); return; }
    } else {                                          // still waiting: bar creeps towards 95%
      setPct(Math.min(95, elapsed / COLD_TIMER * 95));
      // Safety nets (app without the ready signal, or very slow start)
      if (frameLoaded && elapsed >= COLD_TIMER) { reveal(); return; }
      if (elapsed >= FALLBACK_TIMER) { retry.style.display = "block"; reveal(); return; }
    }
    requestAnimationFrame(tick);
  }

  // The app sends a "ready" message to this page as soon as it is connected
  // (small script in app.R). This is what tells a warm app from a cold start.
  window.addEventListener("message", function (ev) {
    if (ev.source !== frame.contentWindow || !ev.data || ev.data.biowatch !== "ready" || endStart) return;
    var elapsed = Date.now() - t0;
    var warm = elapsed < WARM_THRESHOLD;
    var cur = Math.min(95, elapsed / COLD_TIMER * 95);
    endStart = { time: Date.now(), pct: warm ? 0 : cur, ms: warm ? WARM_TIMER : 1500 };
  });

  frame.addEventListener("load", function () { frameLoaded = true; });

  function openApp(base) { frame.src = base.replace(/\/$/, "") + appPath; }   // set once

  if (WORKER_URL.indexOf("workers.dev") > -1 || WORKER_URL.indexOf("http") === 0) {
    fetch(WORKER_URL, { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { openApp(d && d.url ? d.url : tunnelUrl); })
      .catch(function () { openApp(tunnelUrl); });
  } else {
    openApp(tunnelUrl);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
