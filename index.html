<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCI Biodiversity Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d1b2a;
      overflow: hidden;
    }

    /* ── Loading Screen ───────────────────────────────────── */
    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #0d1b2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity 0.8s ease;
    }

    .logo {
      font-size: 64px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%   { transform: translateY(0px); }
      50%  { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    h1 {
      color: #4fc3f7;
      font-size: 26px;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      color: #a0b4c8;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 35px;
      text-align: center;
    }

    /* ── Progress Bar ─────────────────────────────────────── */
    .progress-container {
      width: 280px;
      height: 3px;
      background: #1a4a7a;
      border-radius: 3px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4fc3f7, #0288d1);
      border-radius: 3px;
      transition: width 1s ease;
    }

    /* ── Spinner ──────────────────────────────────────────── */
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid #1a4a7a;
      border-top: 3px solid #4fc3f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ── Status Text ──────────────────────────────────────── */
    .status {
      color: #4a6fa5;
      font-size: 13px;
      height: 20px;
      transition: opacity 0.5s ease;
      text-align: center;
    }

    /* ── Footer ───────────────────────────────────────────── */
    .footer {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #1a3a5a;
      font-size: 11px;
    }

    /* ── App iframe ───────────────────────────────────────── */
    #app-frame {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #app-frame.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- ── Loading Screen ──────────────────────────────────── -->
  <div id="loading">
    <div class="logo">🦜</div>
    <h1>NCI Biodiversity Dashboard</h1>
    <p class="subtitle">Nature and Culture International</p>

    <div class="spinner"></div>

    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <p class="status" id="status-text">Connecting to server...</p>

  </div>

  <!-- ── Footer ─────────────────────────────────────────── -->
  <div class="footer" id="footer">
    Nature and Culture International · Biodiversity Assessment · 2026
  </div>

  <!-- ── App iframe — NO src here, set by JS only ───────── -->
  <iframe
    id="app-frame"
    onload="onIframeLoad()">
  </iframe>

  <script>
    // ════════════════════════════════════════════════════
    // UPDATE THIS after every NAS reboot:
    var tunnelUrl = "https://belfast-dark-liable-price.trycloudflare.com";
    // ════════════════════════════════════════════════════

    // Cold-start timer (first load after NAS restart) — ~70s
    var COLD_TIMER = 70000;
    // Warm timer (app already running in memory) — just a brief flash
    var WARM_TIMER = 4000;

    // Threshold: if iframe responds in under 8s, the R session was already warm
    var WARM_THRESHOLD = 8000;

    var minLoadTime  = COLD_TIMER; // may be shortened below after iframe responds
    var iframeLoaded = false;
    var timerDone    = false;
    var elapsed      = 0;
    var loadStart    = Date.now();
    var mainTimer    = null;

    // ── Status messages timed to cold-start steps ────────
    var coldMessages = [
      { time: 0,      text: "Connecting to server..."            },
      { time: 10000,  text: "Loading bird species data..."       },
      { time: 30000,  text: "Preparing spatial layers..."        },
      { time: 50000,  text: "Loading mammal pipeline..."         },
      { time: 60000,  text: "Loading reptiles and amphibians..." },
      { time: 65000,  text: "Almost ready..."                    }
    ];

    var warmMessages = [
      { time: 0,    text: "Connecting to server..." },
      { time: 1500, text: "Loading dashboard..."    },
      { time: 3000, text: "Almost ready..."         }
    ];

    // ── Progress bar and status messages ─────────────────
    var progressBar = document.getElementById('progress-bar');
    var statusText  = document.getElementById('status-text');

    function scheduleMessages(msgs) {
      msgs.forEach(function(msg) {
        setTimeout(function() {
          statusText.style.opacity = '0';
          setTimeout(function() {
            statusText.textContent   = msg.text;
            statusText.style.opacity = '1';
          }, 250);
        }, msg.time);
      });
    }

    // Start with cold-start messages (will be overridden if warm detected)
    scheduleMessages(coldMessages);

    var progressInterval = setInterval(function() {
      elapsed += 200;
      var pct = Math.min((elapsed / minLoadTime) * 95, 95);
      progressBar.style.width = pct + '%';
      if (elapsed >= minLoadTime) clearInterval(progressInterval);
    }, 200);

    // ── Show app when BOTH timer AND iframe are ready ─────
    function tryShowApp() {
      if (iframeLoaded && timerDone) {
        progressBar.style.width = '100%';
        setTimeout(function() {
          document.getElementById('loading').style.opacity = '0';
          document.getElementById('footer').style.display  = 'none';
          setTimeout(function() {
            document.getElementById('loading').style.display = 'none';
            var frame = document.getElementById('app-frame');
            frame.style.display = 'block';
            setTimeout(function() { frame.classList.add('visible'); }, 50);
          }, 800);
        }, 300);
      }
    }

    // Start the main timer
    function startTimer(ms) {
      minLoadTime = ms;
      elapsed = 0; // reset progress bar base
      mainTimer = setTimeout(function() {
        timerDone = true;
        tryShowApp();
      }, ms);
    }
    startTimer(COLD_TIMER);

    // Called when iframe HTML shell finishes loading
    function onIframeLoad() {
      iframeLoaded = true;
      var responseTime = Date.now() - loadStart;

      // If the server responded quickly → app was already warm in memory
      if (responseTime < WARM_THRESHOLD && !timerDone) {
        // Cancel the cold-start timer and use a short warm timer instead
        clearTimeout(mainTimer);
        clearInterval(progressInterval);
        elapsed = 0;
        scheduleMessages(warmMessages);
        progressBar.style.width = '0%';
        startTimer(WARM_TIMER);
        // Reset progress bar for the short warm sequence
        progressInterval = setInterval(function() {
          elapsed += 200;
          var pct = Math.min((elapsed / WARM_TIMER) * 95, 95);
          progressBar.style.width = pct + '%';
          if (elapsed >= WARM_TIMER) clearInterval(progressInterval);
        }, 200);
      }

      tryShowApp();
    }

    // Ultimate fallback — show after 5 minutes no matter what
    setTimeout(function() {
      iframeLoaded = true;
      timerDone    = true;
      statusText.textContent = 'Loading complete.';
      tryShowApp();
    }, 300000);

    // Set iframe src HERE — only once, avoids double-load bug
    document.getElementById('app-frame').src = tunnelUrl + '/nci-app';
  </script>

</body>
</html>
