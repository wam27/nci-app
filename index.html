  <!-- ── App iframe ─────────────────────────────────────── -->
  <iframe
    id="app-frame"
    onload="onIframeLoad()">
  </iframe>

  <script>
    var tunnelUrl = "https://brass-alarm-barely-nathan.trycloudflare.com";
    var minLoadTime = 120000;

    var iframeLoaded = false;
    var timerDone    = false;
    var elapsed      = 0;

    var messages = [
      { time: 0,      text: "Connecting to server..."         },
      { time: 15000,  text: "Loading species data..."         },
      { time: 40000,  text: "Preparing spatial layers..."     },
      { time: 80000,  text: "Loading mammals and reptiles..."  },
      { time: 100000, text: "Building maps and charts..."     },
      { time: 115000, text: "Almost ready..."                 }
    ];

    var progressBar = document.getElementById('progress-bar');
    var statusText  = document.getElementById('status-text');

    messages.forEach(function(msg) {
      setTimeout(function() {
        statusText.style.opacity = '0';
        setTimeout(function() {
          statusText.textContent  = msg.text;
          statusText.style.opacity = '1';
        }, 250);
      }, msg.time);
    });

    var progressInterval = setInterval(function() {
      elapsed += 200;
      var pct = Math.min((elapsed / minLoadTime) * 95, 95);
      progressBar.style.width = pct + '%';
      if (elapsed >= minLoadTime) clearInterval(progressInterval);
    }, 200);

    function tryShowApp() {
      if (iframeLoaded && timerDone) {
        progressBar.style.width = '100%';
        setTimeout(function() {
          document.getElementById('loading').style.opacity = '0';
          document.getElementById('footer').style.display  = 'none';
          setTimeout(function() {
            document.getElementById('loading').style.display = 'none';
            var frame = document.getElementById('app-frame');
            frame.style.display = 'block';
            setTimeout(function() {
              frame.classList.add('visible');
            }, 50);
          }, 800);
        }, 300);
      }
    }

    function onIframeLoad() {
      iframeLoaded = true;
      tryShowApp();
    }

    setTimeout(function() {
      timerDone = true;
      tryShowApp();
    }, minLoadTime);

    // Fallback — show after 5 minutes no matter what
    setTimeout(function() {
      iframeLoaded = true;
      timerDone    = true;
      statusText.textContent = 'Loading complete.';
      tryShowApp();
    }, 300000);

    // Set iframe src correctly — only done once here
    document.getElementById('app-frame').src = tunnelUrl + '/nci-app';
  </script>
